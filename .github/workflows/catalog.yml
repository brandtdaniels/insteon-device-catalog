name: Catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    container: swift:6.3.3@sha256:1038d54c80063f5cdfabc4560990c30af64b5de8ebf28161deb22ca4ad5db866
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4.2.0
        with:
          path: .build
          key: swift-6.3.3-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swift-6.3.3-
      - name: Build the tools
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test the tools
        run: swift test --skip-build
      - name: Check the profiles and command sets
        run: swift run catalog check
      - name: Check that schema changes bump VERSION
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: swift run catalog version-check "$BASE_SHA"
      - name: Build the site
        run: |
          # PATCH counts the commits since VERSION last changed that changed the data.
          patch=$(git rev-list --count "$(git log -1 --format=%H -- VERSION)..HEAD" -- devices commandSets)
          swift run catalog build --output site --patch "$patch" --built "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # Pull requests build and upload the same artifact; only the deploy job below is skipped.
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
